# Demo variant of frontend/nginx.conf: the backend runs in this same container,
# so /api proxies to loopback instead of the `backend` compose service.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Swagger UI at /api/docs is served by FastAPI, which points it at the
    # root-relative /openapi.json. Without this the SPA fallback answers that
    # with index.html and the docs page renders an empty spec.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy API calls to the backend. The /api prefix is stripped so the backend
    # sees the bare paths (/auth/login, /tickets, ...).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The demo is fronted by the host's TLS terminator; preserve the scheme
        # so the backend marks session cookies Secure correctly.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
