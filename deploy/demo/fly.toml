# Fly.io config for the public demo instance.
#
# Deploy from the REPO ROOT (the image needs both backend/ and frontend/). `app`
# below must be globally unique across Fly — rename it (and PUBLIC_BASE_URL) first.
#
#   fly apps create stingray-tickets-demo
#   fly secrets set SESSION_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
#   fly deploy --config deploy/demo/fly.toml --dockerfile deploy/demo/Dockerfile .
#   fly scale count 1     # REQUIRED — see below
#
# This demo MUST run on exactly ONE machine. Its SQLite DB is ephemeral and
# machine-local, so a second machine serves a second, divergent dataset (a ticket
# created on one is missing from the other). SESSION_SECRET must be set for the
# same reason cookies are signed with it: it has to be stable across restarts.
# Fly has no fly.toml key for machine count — `fly scale count 1` is the control.
#
# No [mounts] section: the SQLite DB is ephemeral on purpose, so every machine
# restart repaints a clean dataset (see deploy/demo/entrypoint.sh).

app = "stingray-tickets-demo"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  COOKIE_SECURE = "true"
  DATABASE_PATH = "/data/demo.db"
  # Re-seed the illustrative dataset on every boot.
  DEMO_RESET = "true"
  # Used in notification emails/links; harmless if SMTP is off (it is here).
  PUBLIC_BASE_URL = "https://stingray-tickets-demo.fly.dev"
  # The AI resolver is a separate process and is intentionally NOT deployed here:
  # it needs provider API keys and push access to a real repo. The demo ships
  # illustrative agent-run data instead.

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle (free-tier friendly). A cold start also re-seeds, so
  # the demo self-cleans after anyone pokes at it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # nginx strips /api, so this hits the backend's /health.
    path = "/api/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
