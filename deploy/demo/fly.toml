# Fly.io config for the public demo instance.
#
# Deploy from the REPO ROOT (the image needs both backend/ and frontend/). `app`
# below must be globally unique across Fly — rename it (and PUBLIC_BASE_URL) first.
#
#   fly apps create stingray-tickets-demo
#   fly secrets set SESSION_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
#   fly secrets set CHAT_API_KEY="sk-or-v1-..."   # an OpenRouter key — see below
#   fly deploy --config deploy/demo/fly.toml --dockerfile deploy/demo/Dockerfile .
#   fly scale count 1     # REQUIRED — see below
#
# This demo MUST run on exactly ONE machine. Its SQLite DB is ephemeral and
# machine-local, so a second machine serves a second, divergent dataset (a ticket
# created on one is missing from the other). SESSION_SECRET must be set for the
# same reason cookies are signed with it: it has to be stable across restarts.
# Fly has no fly.toml key for machine count — `fly scale count 1` is the control.
#
# No [mounts] section: the SQLite DB is ephemeral on purpose, so every machine
# restart repaints a clean dataset (see deploy/demo/entrypoint.sh).
#
# The chat assistant is on here, against OpenRouter's openai/gpt-4o-mini (cheap,
# and reliable at the tool-calling the assistant depends on — see
# deploy/demo/Dockerfile for the model/price/cap tunables, all non-secret and set
# there). CHAT_API_KEY is the one credential in this list, so it is NOT in this
# file or the Dockerfile — set it with `fly secrets set` above. Two guardrails
# make handing that assistant to strangers safe: READ_ONLY (backend/
# read_only_guard.py) means nothing on this deployment writes, and
# CHAT_DAILY_USD_LIMIT bounds the bill.
#
# That cap is looser than "$X/day" sounds, though: DEMO_RESET wipes
# chat_messages on every cold boot along with everything else, and
# spend.spent_today only sums what's in that table — so the cap really resets
# on every machine restart, not just once at UTC midnight. Combined with
# scale-to-zero, a bursty visit pattern (idle → visit → idle → visit) can burn
# the cap more than once in a day. Accepted as-is: the exposure per boot cycle
# is still bounded at the configured amount, and fixing it needs a spend
# counter that survives the reseed, which is more than this demo needs.

app = "stingray-tickets-demo"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  COOKIE_SECURE = "true"
  DATABASE_PATH = "/data/demo.db"
  # Re-seed the illustrative dataset on every boot.
  DEMO_RESET = "true"
  # Used in notification emails/links; harmless if SMTP is off (it is here).
  PUBLIC_BASE_URL = "https://stingray-tickets-demo.fly.dev"
  # Already the Dockerfile's default; repeated here so the deploy-time config is
  # self-describing without having to open the image build too. CHAT_API_KEY is
  # deliberately absent from both — see the header comment and `fly secrets set`.
  READ_ONLY = "true"
  SHOW_DEMO_CREDENTIALS = "true"
  CHAT_API_URL = "https://api.mistral.ai/v1/chat/completions"
  CHAT_API_MODEL = "ministral-3b-latest"
  CHAT_PRICE_IN = "0.00010"
  CHAT_PRICE_OUT = "0.00010"
  CHAT_DAILY_USD_LIMIT = "1.00"
  CHAT_RATE_LIMIT = "5/minute"
  # The AI resolver is a separate process and is intentionally NOT deployed here:
  # it needs provider API keys and push access to a real repo. The demo ships
  # illustrative agent-run data instead.

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle. A cold start re-seeds, so the demo self-cleans after
  # anyone pokes at it — and an idle demo costs ~$0.05/mo instead of $3.19.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # This check does NOT block autostop — measured, twice, by removing it and
  # watching the machine still refuse to sleep.
  #
  # If this demo won't scale to zero, the cause is almost certainly an open
  # browser tab: the notification bell polls /api/notifications/unread_count
  # every 30s (60s once the tab is backgrounded and the browser throttles it),
  # and each poll is real traffic that wakes the machine straight back up. One
  # forgotten tab is the difference between ~$0.05/mo and $3.19/mo.
  [[http_service.checks]]
    # nginx strips /api, so this hits the backend's /health.
    path = "/api/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
