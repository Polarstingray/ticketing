# Ruff config for the Python code (backend + resolver + cli). The frontend is JS.
target-version = "py312"
line-length = 100

# Import roots, so first-party modules (e.g. `from database import ...`) are
# grouped separately from third-party packages by the import sorter.
src = ["backend", "resolver", "cli"]

# Don't consult .gitignore when walking the tree. In some dev sandboxes /home is
# an autofs mount and ruff's gitignore walk stalls statting ancestor dirs; the
# explicit excludes below cover what .gitignore would have skipped anyway.
respect-gitignore = false

extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "resolver/work",   # per-ticket git worktrees the resolver checks out
    "resolver/logs",
    "frontend",
    # Scaffold templates: deliberately-unfinished code with {{placeholders}} that
    # is rendered, not imported. Linting it would flag the stubs it exists to ship.
    "cli/stingray_cli/templates",
    # Packaging output. These are gitignored (cli/.gitignore), but respect-gitignore
    # is off above, so ruff would otherwise walk them — and cli/build/lib holds a
    # stale *copy* of the sources, making every finding in it a duplicate of one in
    # cli/stingray_cli that gets fixed in the wrong place.
    "build",
    "dist",
    "*.egg-info",
]

[lint]
# A pragmatic starter set: pyflakes (F), pycodestyle errors/warnings (E/W),
# and import sorting (I). Add more rule families later if wanted.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length: enforced loosely; long log/help strings are fine
]
