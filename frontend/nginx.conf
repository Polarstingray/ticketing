server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # If you front this container with another reverse proxy (Traefik — see
    # traefik-labels.md), uncomment the block below so $remote_addr becomes the
    # real client instead of that proxy. real_ip_recursive stays OFF on purpose:
    # nginx then takes the RIGHTMOST X-Forwarded-For entry, which is the address
    # the trusted hop actually observed, so a client-supplied header cannot win.
    # Only list networks you control — anything trusted here can spoof its IP.
    # set_real_ip_from 172.16.0.0/12;   # docker bridge networks
    # real_ip_header X-Forwarded-For;

    # Proxy API calls to the backend service. The /api prefix is stripped so the
    # backend sees the bare paths (/auth/login, /tickets, ...).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never $proxy_add_x_forwarded_for (which APPENDS to whatever
        # the client sent). The backend runs uvicorn with --forwarded-allow-ips
        # "*", which takes the LEFTMOST entry, so appending would let any caller
        # choose their own request.client.host — and with it their bucket in the
        # per-IP login limiter and in backend/login_throttle.py.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
