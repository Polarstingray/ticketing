server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server-level so they apply to the SPA documents, error
    # pages, and proxied API responses alike). `always` ensures they're sent on
    # error responses too. TLS terminates upstream (Traefik), so HSTS is safe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP for the built SPA. 'unsafe-inline' on style-src accommodates the
    # CSS-module / highlight.js inline styles (CodeBlockViewer); script-src is
    # locked to 'self'. frame-ancestors 'none' is the modern clickjacking guard.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service. The /api prefix is stripped so the
    # backend sees the bare paths (/auth/login, /tickets, ...).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
