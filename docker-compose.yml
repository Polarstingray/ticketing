services:
  backend:
    build: ./backend
    container_name: stingray-backend
    restart: unless-stopped
    environment:
      # Initial admin (created only on first run when the DB is empty).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      # Deployment environment. Set to "production" on a real server: the app
      # then refuses to start with a default/empty SESSION_SECRET. Default "dev"
      # only warns. (COOKIE_SECURE=true also implies production.)
      APP_ENV: ${APP_ENV:-dev}
      # Secret used to sign session cookies. CHANGE THIS in production.
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      # Set to "true" when served over HTTPS (Traefik) so the cookie is Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: /data/stingray.db
      # Allowed browser origins for CORS (dev convenience; same-origin in prod).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Optionally provision the resolver bot on first boot (empty DB): creates a
      # least-privilege member user flagged is_resolver_bot and mints its API key,
      # writing both to /data/resolver-bootstrap.json for install.sh to read. The
      # core app does not need this; leave false unless you use the resolver.
      SEED_RESOLVER_BOT: ${SEED_RESOLVER_BOT:-false}
      RESOLVER_BOT_USERNAME: ${RESOLVER_BOT_USERNAME:-claude-bot}
      # Legacy/optional: trust a resolver bot by user id. No longer required now
      # that the seeded bot carries an is_resolver_bot DB flag (which can't drift).
      # Still honored for older deployments. MUST match the resolver's
      # RESOLVER_BOT_USER_ID if you rely on it.
      RESOLVER_BOT_USER_ID: ${RESOLVER_BOT_USER_ID:-0}
      # Shared rate-limit storage for multi-worker/replica deploys (e.g.
      # redis://redis:6379). Empty => per-process in-memory (fine for one worker).
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-}
      # Email notifications (optional). Leave SMTP_HOST empty to disable.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-stingray@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # Chat assistant (optional). The feature is OFF unless all three of
      # URL/KEY/MODEL are non-empty — the popup does not render at all, and the
      # endpoints 503 — so a stock deployment carries no trace of it. Everything
      # below is a tunable with a working default; see .env.example.
      CHAT_API_URL: ${CHAT_API_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_API_MODEL: ${CHAT_API_MODEL:-}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-120}
      CHAT_CONTEXT_BUDGET: ${CHAT_CONTEXT_BUDGET:-60000}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-20/minute}
      CHAT_PRICE_IN: ${CHAT_PRICE_IN:-0}
      CHAT_PRICE_OUT: ${CHAT_PRICE_OUT:-0}
      CHAT_DAILY_USD_LIMIT: ${CHAT_DAILY_USD_LIMIT:-0}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-10}
      CHAT_STREAM_USAGE: ${CHAT_STREAM_USAGE:-true}
      # How many times the assistant may call a tool before it must answer from
      # what it has. 0 disables tools entirely.
      CHAT_MAX_TOOL_HOPS: ${CHAT_MAX_TOOL_HOPS:-6}
    volumes:
      - stingray-data:/data
    networks:
      - internal
    # Gate the frontend on the backend being reachable so nginx doesn't 502 on a
    # cold start. Uses the stdlib (no curl in the slim image) to hit /health.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # No published port by default — the frontend proxies to it over the
    # internal network. Uncomment to expose the API directly:
    # ports:
    #   - "8000:8000"

  frontend:
    build: ./frontend
    container_name: stingray-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      # - web        # <- external Traefik network; see traefik-labels.md
    ports:
      - "3000:3000"
    # Traefik labels go here when wiring into your reverse proxy.
    # See traefik-labels.md for a ready-to-paste block.
    # labels:
    #   - "traefik.enable=true"

  # Optional: periodic SQLite backups into the data volume's `backups/` dir,
  # using the online backup API (safe while the backend runs). Uncomment to
  # enable; tune the interval and retention to taste.
  # backup:
  #   build: ./backend
  #   container_name: stingray-backup
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_PATH: /data/stingray.db
  #   volumes:
  #     - stingray-data:/data
  #   networks:
  #     - internal
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - "while true; do python backup_db.py --keep 14; sleep 86400; done"

networks:
  internal:
    driver: bridge
  # web:
  #   external: true

volumes:
  stingray-data:
